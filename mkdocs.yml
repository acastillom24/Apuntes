site_name: Apuntes
site_url: https://acastillom24.github.io/Apuntes/
repo_url: https://github.com/acastillom24/Apuntes
repo_name: acastillom24/Apuntes
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Herramientas:
      - Git: herramientas/git.md
      - Winget: herramientas/winget.md
      - Pandoc: herramientas/pandoc.md
      - ffmpeg: herramientas/ffmpeg.md
  - Data Science:
      - Kaggle: data-science/kaggle.md
